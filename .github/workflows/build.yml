name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      # AGP 9.4.1 / compileSdk 37，runner 上默认没有，得自己装；
      # build-tools 不写死版本，交给 AGP 自己拉（版本号会随 AGP 变）
      - name: 安装 platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" > /dev/null

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/com.oppocamera.unlock-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
