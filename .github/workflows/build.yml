name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不依赖 runner 里的 /usr/local/lib/android/sdk（权限/布局都不稳），
      # 直接在用户目录装一份 cmdline-tools，再装 platform 37（compileSdk 37）。
      - name: 准备 Android SDK
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # build-tools 不写死版本，交给 AGP 自己拉
          "$SDKMANAGER" "platform-tools" "platforms;android-37"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/com.oppocamera.unlock-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
