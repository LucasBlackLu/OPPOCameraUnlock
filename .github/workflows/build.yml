name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 不依赖 runner 里的 /usr/local/lib/android/sdk（权限/布局都不稳），
      # 直接在用户目录装一份 cmdline-tools，再装 platform 37（compileSdk 37）。
      # 失败时把 stderr 打成 ::error::，这样没有 token 也能从 check-runs 注释里看到原因。
      - name: 准备 Android SDK
        run: |
          set +e
          (
            set -e
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            echo "STEP 1 download cmdline-tools"
            curl -fsSL -o /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            echo "STEP 2 unzip"
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            echo "STEP 3 move"
            mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            echo "STEP 4 version"
            "$SDKMANAGER" --version
            echo "STEP 5 licenses"
            for _ in $(seq 1 50); do echo y; done | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "STEP 6 install platform"
            # SDK 37 是小版本命名（android-37.0），而且在 canary 频道里；
            # build-tools 用 AGP 9.4.1 默认的 36.0.0
            for _ in $(seq 1 50); do echo y; done | "$SDKMANAGER" --channel=3 \
              "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          ) > /tmp/sdk.log 2>&1
          rc=$?
          tail -40 /tmp/sdk.log
          if [ $rc -ne 0 ]; then
            { echo "rc=$rc"; tail -8 /tmp/sdk.log; } | sed 's/^/::error::/'
            exit $rc
          fi

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/com.oppocamera.unlock-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
