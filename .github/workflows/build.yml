name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像里已经带 Android SDK，只是没有 platform 37（compileSdk 37）。
      # 不依赖 android-actions/setup-android：那个 action 偶尔会在建 SDK 目录时挂掉。
      - name: 安装 platform 37
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools 缺失，临时装一份"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest" 2>/dev/null || true
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # build-tools 不写死版本，交给 AGP 自己拉
          "$SDKMANAGER" "platform-tools" "platforms;android-37"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/com.oppocamera.unlock-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: com.oppocamera.unlock-debug
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
